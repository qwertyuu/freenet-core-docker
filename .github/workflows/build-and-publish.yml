name: Build and publish on new freenet-core release

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/freenet-core-docker

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest freenet-core release tag
        id: latest
        run: |
          TAG=$(gh api repos/freenet/freenet-core/releases/latest --jq '.tag_name')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare against last built tag
        id: compare
        run: |
          LAST=""
          if [ -f .last_built_tag ]; then
            LAST=$(cat .last_built_tag)
          fi
          echo "Latest upstream tag: ${{ steps.latest.outputs.tag }}"
          echo "Last built tag:      $LAST"
          if [ "$LAST" != "${{ steps.latest.outputs.tag }}" ]; then
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.compare.outputs.build_needed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.compare.outputs.build_needed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.compare.outputs.build_needed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            FREENET_TAG=${{ steps.latest.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.latest.outputs.tag }}
            ${{ env.IMAGE }}:latest

      - name: Record built tag
        if: steps.compare.outputs.build_needed == 'true'
        run: |
          echo "${{ steps.latest.outputs.tag }}" > .last_built_tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_built_tag
          git commit -m "Build ${{ steps.latest.outputs.tag }}"
          git push
